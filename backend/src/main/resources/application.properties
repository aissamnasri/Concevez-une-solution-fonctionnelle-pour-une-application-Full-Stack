spring.application.name=ycyw-chat-poc
server.port=8080

# --- Base de donnees -------------------------------------------------------
# Les valeurs par defaut correspondent au docker-compose.yml fourni.
# Elles sont destinees au developpement local uniquement (aucun secret reel).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ycyw_chat}
spring.datasource.username=${DATABASE_USERNAME:ycyw}
spring.datasource.password=${DATABASE_PASSWORD:ycyw-local-dev}

# --- JPA / Hibernate -------------------------------------------------------
# ddl-auto=update : simplification de PoC (voir README, section "Limites du PoC").
# Un projet reel utiliserait Flyway ou Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CORS et WebSocket -----------------------------------------------------
# Origines autorisees pour l'API REST et la poignee de main WebSocket.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Logs ------------------------------------------------------------------
logging.level.com.yourcaryourway.chat=INFO
